[project]
name = "retailops"
version = "0.0.1"
description = "RetailOps Analyst Agent: multi-agent retail operations assistant (LangGraph, LangSmith). Synthetic data only."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph==1.2.16",
    "langchain==1.4.6",
    "langchain-core==1.6.12",
    "langsmith==0.14.11",
    "langchain-anthropic==1.7.6",
    "langgraph-checkpoint-sqlite==3.1.2",
    "duckdb==1.5.6",
    "sqlglot==30.23.0",
    "pydantic==2.14.1",
    "pydantic-settings>=2",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy>=1.10",
    "pre-commit>=3",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retailops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/retailops/config.py", "src/retailops/guards"]
plugins = ["pydantic.mypy"]
